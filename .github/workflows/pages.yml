# Собирает сайт и публикует его на GitHub Pages при каждом push в main.
# Один раз включить: Settings → Pages → Build and deployment → Source: GitHub Actions.

name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:            # кнопка «Run workflow» для ручного запуска

# Минимальные права: читать код, публиковать Pages, получать OIDC-токен для деплоя
permissions:
  contents: read
  pages: write
  id-token: write

# Если пуши идут подряд — старый незавершённый деплой отменяется, публикуется последний
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  # Сборка: Node без зависимостей → папка _site → артефакт для Pages
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node tools/build.mjs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  # Публикация собранного артефакта; ссылка на сайт появится в окружении github-pages
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
