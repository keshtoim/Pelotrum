<!doctype html>
<html lang="ru" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>pelotrum — Telegram-боты и vibecode</title>
<meta name="description" content="Разработка Telegram-ботов под ключ и vibecode под задачу заказчика.">
<script>
  // ставим тему и язык до отрисовки, чтобы не мигало
  (function () {
    var q = new URLSearchParams(location.search), t = q.get('theme'), l = q.get('lang');
    try { t = t || localStorage.getItem('theme'); l = l || localStorage.getItem('lang'); } catch (e) {}
    if (!t) t = matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
    if (!l) l = (navigator.language || 'ru').toLowerCase().startsWith('ru') ? 'ru' : 'en';
    document.documentElement.dataset.theme = t;
    document.documentElement.lang = l;
  })();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!-- Все шрифты — SIL Open Font License: бесплатно для любого, в т.ч. коммерческого использования -->
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&family=Caveat:wght@700&family=Onest:wght@400;500;600;700;800&family=Playfair+Display:ital,wght@0,600;0,800;1,600&family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/skins/a-main.css" id="skinLink">
<script>
  // вариант дизайна: ?style=a..e или последний выбранный
  window.SKINS = {
    a: { file: 'a-main', name: 'Main' },
    b: { file: 'b-bento', name: 'Bento' },
    c: { file: 'c-terminal', name: 'Terminal' },
    d: { file: 'd-editorial', name: 'Editorial' },
    e: { file: 'e-soft', name: 'Soft' },
    f: { file: 'f-main-terminal', name: 'Main×Term' }
  };
  (function () {
    var s = new URLSearchParams(location.search).get('style');
    if (!s) { try { s = localStorage.getItem('variant'); } catch (e) {} }
    if (!SKINS[s]) s = 'a';
    document.documentElement.dataset.skin = s;
    document.getElementById('skinLink').href = 'css/skins/' + SKINS[s].file + '.css';
  })();
</script>
</head>
<body>

<!-- ============ HEADER ============ -->
<header class="header">
  <div class="container header__inner">
    <a href="#top" class="logo" aria-label="pelotrum">
      <span class="logo__mark">p</span>
      <span class="logo__word">pelotrum</span>
    </a>

    <nav class="nav" id="nav">
      <a href="#work" data-i18n="nav.work"></a>
      <a href="#services" data-i18n="nav.services"></a>
      <a href="#benefits" data-i18n="nav.benefits"></a>
      <a href="#blog" data-i18n="nav.blog"></a>
      <a href="#about" data-i18n="nav.about"></a>
      <a href="#contact" data-i18n="nav.contact"></a>
    </nav>

    <div class="header__tools">
      <button class="tool lang-toggle" id="langToggle" aria-label="Language">
        <span data-lang="ru">RU</span><span data-lang="en">EN</span>
      </button>
      <button class="tool theme-toggle" id="themeToggle" aria-label="Theme">
        <svg class="i-sun" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4.5"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        <svg class="i-moon" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/></svg>
      </button>
      <a href="#contact" class="btn btn--acc btn--sm header__cta" data-i18n="nav.cta"></a>
      <button class="tool burger" id="burger" aria-label="Menu"><span></span><span></span></button>
    </div>
  </div>
</header>

<main id="top">

  <!-- ============ HERO ============ -->
  <section class="hero">
    <div class="container hero__inner">
      <div class="hero__text">
        <p class="kicker" data-i18n="hero.kicker"></p>
        <h1 class="hero__title" data-i18n="hero.title"></h1>
        <p class="hero__sub" data-i18n="hero.sub"></p>
        <div class="hero__ctas">
          <a href="#contact" class="btn btn--acc" data-i18n="hero.cta1"></a>
          <a href="#work" class="btn btn--ghost" data-i18n="hero.cta2"></a>
        </div>
        <ul class="facts">
          <li><b data-i18n="hero.f1v"></b><span data-i18n="hero.f1"></span></li>
          <li><b data-i18n="hero.f2v"></b><span data-i18n="hero.f2"></span></li>
          <li><b data-i18n="hero.f3v"></b><span data-i18n="hero.f3"></span></li>
        </ul>
      </div>

      <div class="hero__demo">
        <span class="hand hand--demo" data-i18n="hero.note"></span>
        <div class="chat">
          <div class="chat__head">
            <span class="chat__ava">p</span>
            <div>
              <b>pelotrum bot</b>
              <small data-i18n="chat.status"></small>
            </div>
          </div>
          <div class="chat__body" id="chatBody"></div>
          <div class="chat__input">
            <span data-i18n="chat.placeholder"></span>
            <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor"><path d="M3 20.5v-6l8-2.5-8-2.5v-6L22 12z"/></svg>
          </div>
        </div>
      </div>
    </div>
  </section>

  <!-- ============ TICKER ============ -->
  <div class="ticker" aria-hidden="true">
    <div class="ticker__track" id="ticker"></div>
  </div>

  <!-- ============ PORTFOLIO ============ -->
  <section class="section" id="work">
    <div class="container">
      <div class="section__head">
        <p class="kicker">01 / <span data-i18n="nav.work"></span></p>
        <h2 class="section__title" data-i18n="work.title"></h2>
      </div>

      <div class="filters" id="filters">
        <button class="chip is-active" data-filter="all" data-i18n="work.f.all"></button>
        <button class="chip" data-filter="bot" data-i18n="work.f.bot"></button>
        <button class="chip" data-filter="miniapp" data-i18n="work.f.miniapp"></button>
        <button class="chip" data-filter="web" data-i18n="work.f.web"></button>
        <button class="chip" data-filter="auto" data-i18n="work.f.auto"></button>
      </div>

      <div class="grid grid--work" id="workGrid"></div>
    </div>
  </section>

  <!-- ============ SERVICES ============ -->
  <section class="section section--alt" id="services">
    <div class="container">
      <div class="section__head">
        <p class="kicker">02 / <span data-i18n="nav.services"></span></p>
        <h2 class="section__title" data-i18n="services.title"></h2>
      </div>
      <div class="grid grid--price" id="priceGrid"></div>
      <p class="note" data-i18n="services.note"></p>
    </div>
  </section>

  <!-- ============ BENEFITS ============ -->
  <section class="section" id="benefits">
    <div class="container">
      <div class="section__head">
        <p class="kicker">03 / <span data-i18n="nav.benefits"></span></p>
        <h2 class="section__title" data-i18n="benefits.title"></h2>
      </div>
      <div class="grid grid--benefits" id="benefitsGrid"></div>
    </div>
  </section>

  <!-- ============ BLOG ============ -->
  <section class="section section--alt" id="blog">
    <div class="container">
      <div class="section__head section__head--row">
        <div>
          <p class="kicker">04 / <span data-i18n="nav.blog"></span></p>
          <h2 class="section__title" data-i18n="blog.title"></h2>
        </div>
        <a href="#" class="link-arrow" data-i18n="blog.all"></a>
      </div>
      <div class="grid grid--blog" id="blogGrid"></div>
    </div>
  </section>

  <!-- ============ ABOUT ============ -->
  <section class="section" id="about">
    <div class="container about">
      <div class="about__photo">
        <div class="photo-ph"><span>p</span></div>
        <span class="hand hand--photo" data-i18n="about.photo"></span>
      </div>
      <div class="about__text">
        <p class="kicker">05 / <span data-i18n="nav.about"></span></p>
        <h2 class="section__title" data-i18n="about.title"></h2>
        <p data-i18n="about.p1"></p>
        <p data-i18n="about.p2"></p>
        <ul class="stack">
          <li>Python</li><li>aiogram</li><li>Node.js</li><li>TypeScript</li>
          <li>PostgreSQL</li><li>Redis</li><li>Docker</li><li>Mini Apps</li><li>LLM API</li>
        </ul>
      </div>
    </div>
  </section>

  <!-- ============ CONTACT ============ -->
  <section class="section" id="contact">
    <div class="container">
      <div class="cta-box">
        <span class="sticker sticker--cta" data-i18n="contact.sticker"></span>
        <p class="kicker">06 / <span data-i18n="nav.contact"></span></p>
        <h2 class="cta-box__title" data-i18n="contact.title"></h2>
        <p class="cta-box__sub" data-i18n="contact.sub"></p>
        <div class="cta-box__links">
          <a href="#" class="btn btn--acc btn--lg">
            <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor"><path d="M21.9 4.3 18.7 19.4c-.2 1-.9 1.3-1.8.8l-4.9-3.6-2.4 2.3c-.3.3-.5.5-1 .5l.4-5 9.1-8.2c.4-.4-.1-.6-.6-.2L6.3 13 1.5 11.5c-1-.3-1.1-1 .2-1.5L20.6 2.8c.9-.3 1.6.2 1.3 1.5z"/></svg>
            Telegram · @username
          </a>
          <a href="#" class="btn btn--ghost btn--lg">hello@pelotrum.dev</a>
        </div>
      </div>
    </div>
  </section>
</main>

<footer class="footer">
  <div class="container footer__inner">
    <a href="#top" class="logo logo--sm"><span class="logo__mark">p</span><span class="logo__word">pelotrum</span></a>
    <span class="footer__copy">© 2026 pelotrum · <span data-i18n="footer.made"></span></span>
    <a href="#top" class="link-arrow" data-i18n="footer.top"></a>
  </div>
</footer>

<!-- ============ ПАНЕЛЬ ПРОТОТИПОВ (не часть сайта) ============ -->
<div class="proto" id="proto">
  <span class="proto__label">variant</span>
  <button data-skin="a" title="Main">A</button>
  <button data-skin="b" title="Bento">B</button>
  <button data-skin="c" title="Terminal">C</button>
  <button data-skin="d" title="Editorial">D</button>
  <button data-skin="e" title="Soft">E</button>
  <button data-skin="f" title="Main × Terminal">F</button>
  <span class="proto__name" id="protoName"></span>
</div>

<script src="js/i18n.js"></script>
<script src="js/main.js"></script>
</body>
</html>
